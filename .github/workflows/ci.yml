name: CI

# Fast safety gate that runs on every push/PR to main. It exists because
# the Render (backend) and Vercel (frontend) builds have FAILED in the past
# when committed code referenced files that weren't part of the commit, or
# when strict-TS errors slipped past `ng serve`. A clean-checkout build here
# catches both classes of failure BEFORE Render/Vercel try to deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run if a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend · Django system check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check (imports settings + the full URLconf + views)
        env:
          # DEBUG=true so the dev SECRET_KEY fallback applies; a dummy
          # DATABASE_URL keeps DATABASES deterministic. `check` never
          # connects to the DB, so the credentials don't need to be real.
          DJANGO_DEBUG: 'true'
          DATABASE_URL: 'postgres://ci:ci@localhost:5432/ci'
        run: python manage.py check

  frontend-build:
    name: Frontend · production build (strict TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
