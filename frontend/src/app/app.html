<div dir="ltr" class="min-h-screen flex">
  <!-- Right sidebar — collapsible. The aside slides off-screen when closed. -->
  <aside class="fixed top-0 right-0 h-screen
                bg-white border-l border-ink-200 z-10 shadow-card
                transition-all duration-300 ease-out"
         [class.w-72]="sidebarOpen()"
         [class.w-0]="!sidebarOpen()">
    @if (sidebarOpen()) {
      <app-researcher-search-sidebar />
    }
  </aside>

  <!-- Toggle handle — small tab attached to the sidebar's left edge -->
  <button (click)="toggleSidebar()"
          [style.right.px]="sidebarOpen() ? 288 : 0"
          class="fixed top-4 z-20
                 w-7 h-12 flex items-center justify-center
                 bg-white border border-ink-200 border-r-0
                 rounded-l-apple shadow-card
                 hover:bg-ink-50 transition-all duration-300"
          [attr.aria-label]="sidebarOpen() ? 'Close sidebar' : 'Open sidebar'">
    <svg class="w-4 h-4 text-ink-600 transition-transform"
         [class.rotate-180]="!sidebarOpen()"
         fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <!-- Main content — margin adjusts to sidebar width -->
  <main class="flex-1 min-h-screen transition-all duration-300"
        [class.mr-72]="sidebarOpen()"
        [class.mr-0]="!sidebarOpen()">
    <router-outlet />
  </main>
</div>
