<div class="min-h-screen flex items-center justify-center bg-ink-50 px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-10">
      <img src="/LitrixLogo.svg" alt="Litrix" class="h-12 w-auto mx-auto" />
      <p class="text-sm text-ink-500 mt-3">Research Analytics Platform</p>
    </div>

    <div class="bg-white rounded-2xl shadow-card p-8">
      <h2 class="text-xl font-semibold text-ink-900 mb-1">Welcome back</h2>
      <p class="text-sm text-ink-500 mb-6">Sign in to continue</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-ink-500 mb-1.5 uppercase tracking-wide">
            Email
          </label>
          <input type="email" formControlName="email"
                 class="w-full px-4 py-2.5 rounded-lg border border-ink-200
                        focus:border-accent focus:ring-2 focus:ring-accent/20
                        outline-none transition text-sm"
                 placeholder="you@example.com" />
        </div>

        <div>
          <label class="block text-xs font-medium text-ink-500 mb-1.5 uppercase tracking-wide">
            Password
          </label>
          <input type="password" formControlName="password"
                 class="w-full px-4 py-2.5 rounded-lg border border-ink-200
                        focus:border-accent focus:ring-2 focus:ring-accent/20
                        outline-none transition text-sm"
                 placeholder="••••••••" />
        </div>

        @if (error()) {
          <div class="text-xs text-red-600 bg-red-50 px-3 py-2 rounded-lg">
            {{ error() }}
          </div>
        }

        <button type="submit"
                [disabled]="form.invalid || loading()"
                class="w-full py-2.5 rounded-lg bg-ink-900 text-white text-sm font-medium
                       hover:bg-ink-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
          {{ loading() ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="flex items-center justify-between text-xs text-ink-400 pt-2">
          <a routerLink="/forgot-password" class="hover:text-ink-700 transition">
            Forgot password?
          </a>
          <a routerLink="/register" class="hover:text-ink-700 transition">
            Create account
          </a>
        </div>
      </form>
    </div>

    <p class="text-center text-xs text-ink-400 mt-6">
      © Litrix Platform · Al-Baha University
    </p>
  </div>
</div>
